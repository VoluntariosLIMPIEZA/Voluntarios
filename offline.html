<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#eef1f6">
  <title>Sin conexión — Voluntarios de Limpieza</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef1f6;
      color: #0f172a;
      padding: 24px;
    }
    .box {
      max-width: 420px;
      text-align: center;
      background: #fff;
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 18px 40px -24px rgba(15, 23, 42, 0.22);
      border: 1px solid #e6ebf2;
    }
    img { width: 88px; height: 88px; margin-bottom: 16px; }
    h1 { font-size: 1.35rem; margin-bottom: 8px; letter-spacing: -0.03em; }
    p { color: #64748b; margin-bottom: 24px; line-height: 1.5; }
    a {
      display: inline-flex;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      background: #0f172a;
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="icons/icon-192.png" alt="Voluntarios de Limpieza">
    <h1>Sin conexión</h1>
    <p>No hay internet y esta pantalla no está en la caché. Cuando vuelvas a estar en línea, recarga para abrir la app.</p>
    <a href="./index.html">Reintentar</a>
  </div>
</body>
</html>
