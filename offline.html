<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <title>Sin conexión — Voluntarios de Limpieza</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      color: #1e293b;
      padding: 24px;
    }
    .box {
      max-width: 420px;
      text-align: center;
      background: #fff;
      border-radius: 32px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1);
    }
    img { width: 88px; height: 88px; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    p { color: #64748b; margin-bottom: 24px; line-height: 1.5; }
    a {
      display: inline-flex;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 40px;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="icons/icon-192.png" alt="Voluntarios de Limpieza">
    <h1>Sin conexión</h1>
    <p>No hay internet y esta pantalla no está en la caché. Cuando vuelvas a estar en línea, recarga para abrir la app.</p>
    <a href="./index.html">Reintentar</a>
  </div>
</body>
</html>
